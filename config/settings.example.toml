[bridge]
host = "127.0.0.1"
port = 8199
api_key = "hermes-local-2026"

[nine_router]
url = "http://localhost:20128"

[github]
owner = "Yuanilvu"
repo = "hermes-bridge"

[vault]
path = "/home/yuan/hermes-workspace"

[limits]
# Max request body size in bytes (default: 10MB)
max_body_bytes = 10_485_760
# Max vault file write size in bytes (default: 1MB)
max_vault_write_bytes = 1_048_576
